name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/verify.ps1
      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kayro_secureguard
          path: |
            dist/kayro_secureguard-*.zip
            dist/kayro_secureguard-*.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build module
        shell: pwsh
        run: pwsh -NoProfile -File ./build.ps1
      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-ChildItem dist -Filter 'kayro_secureguard-*.zip' | Select-Object -First 1
          $sha = "$($zip.FullName).sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip.FullName $sha --clobber
          } else {
            gh release create $tag $zip.FullName $sha --title "Kayro SecureGuard Lite $tag" --generate-notes
          }
